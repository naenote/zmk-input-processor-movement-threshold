description: |
  Filters X/Y movement events whose absolute value is <= threshold (param1).
  Events below the threshold are consumed and will not trigger auto-mouse-layer.

  Usage example:
    zip_movement_threshold: zip_movement_threshold {
        compatible = "zmk,input-processor-movement-threshold";
        #input-processor-cells = <1>;
    };
    // In listener: <&zip_movement_threshold 8>

compatible: "zmk,input-processor-movement-threshold"

properties:
  "#input-processor-cells":
    type: int
    const: 1
  track-remainders:
    type: boolean

# NOTE: ZMK reads processor parameters by the literal cell names `param1` and
# `param2` (see ZMK_INPUT_PROCESSOR_ENTRY_AT_IDX in drivers/input_processor.h).
# A cell named anything else makes DT_PHA_HAS_CELL_AT_IDX() report 0, and the
# parameter is silently substituted with 0 instead of the value in the DTS.
input-processor-cells:
  - param1
